name: release / gem

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: gh-token-gen
        uses: oakcask/gh-token-gen@4bd7b29d36a07b1de07b49c9fdbfe16c03d00bc2 # v5.1.0
        with:
          app-id: ${{ secrets.TOKEN_GEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_GEN_PRIVATE_KEY }}
      - name: Create release pull request or draft release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.gh-token-gen.outputs.token }}
      - name: Check out release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - name: Set up Ruby
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      - name: Build gem
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: gem build schemurai.gemspec --output schemurai-${{ steps.release.outputs.version }}.gem
      - name: Push gem to RubyGems.org
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: gem push schemurai-${{ steps.release.outputs.version }}.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
