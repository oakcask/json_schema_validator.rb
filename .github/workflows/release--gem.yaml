name: release / gem

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: gh-token-gen
        uses: oakcask/gh-token-gen@4bd7b29d36a07b1de07b49c9fdbfe16c03d00bc2 # v5.1.0
        with:
          app-id: ${{ secrets.TOKEN_GEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_GEN_PRIVATE_KEY }}
      - name: Create release pull request or draft release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.gh-token-gen.outputs.token }}
      # release-please does not update the Bundler 4 CHECKSUMS entry for the
      # gem being released. Regenerate the lockfile on the release PR branch.
      - name: Check out release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.gh-token-gen.outputs.token }}
          submodules: true
      - name: Set up Ruby for lockfile update
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      - name: Regenerate lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: bundle lock
      - name: Commit regenerated lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          git config user.name "oakcask-actions[bot]"
          git config user.email "206904404+oakcask-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "chore: regenerate lockfile"
          git push origin "HEAD:${RELEASE_BRANCH}"

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      - name: Build gem
        run: gem build schemurai.gemspec --output schemurai-${{ needs.release.outputs.version }}.gem
      - name: Upload gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schemurai-${{ needs.release.outputs.version }}
          path: schemurai-${{ needs.release.outputs.version }}.gem
          compression-level: 0
          if-no-files-found: error

  publish:
    needs:
      - release
      - build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ruby
      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: schemurai-${{ needs.release.outputs.version }}
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push gem to RubyGems.org
        run: gem push schemurai-${{ needs.release.outputs.version }}.gem
