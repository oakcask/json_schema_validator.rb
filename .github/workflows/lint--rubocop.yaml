name: lint / rubocop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - Gemfile.lock
      - "**/*.rb"
  pull_request:
    paths:
      - .github/workflows/lint--rubocop.yaml
      - .rubocop.yml
      - Gemfile.lock
      - "**/*.rb"

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
          cache-version: ${{ hashFiles('Gemfile.lock') }}
      - name: Run Ruby tests
        run: bundle exec rubocop
